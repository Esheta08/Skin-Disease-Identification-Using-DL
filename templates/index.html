{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-sm-12">
        <div class="card shadow-lg p-4 bg-white rounded text-center">
            <h4 class="text-secondary mb-4">Diagnostic Upload Panel</h4>
            
            <form id="upload-form" method="post" enctype="multipart/form-data">
                <input type="file" name="file" id="imageUpload" accept=".png, .jpg, .jpeg">
                
                <label for="imageUpload" class="upload-label rounded">
                    Choose Skin Image...
                </label>
            </form>

            <div class="row justify-content-center">
                <div id="imagePreview" class="img-preview" style="display:none;">
                    <div id="preview-div"></div>
                </div>
            </div>

            <div class="mt-2">
                <button type="button" class="btn btn-info btn-lg px-5" id="btn-predict" style="display:none;">
                    Run Deep Learning Inference
                </button>
            </div>

            <div class="row justify-content-center mt-4">
                <div class="loader" id="loader" style="display:none;"></div>
            </div>

            <div class="mt-4 p-3 bg-light border rounded text-left" id="result-section" style="display:none;">
                <h5 class="text-success border-bottom pb-2">Analysis Report</h5>
                <p class="mb-1"><strong>Primary Prediction:</strong> <span id="prediction-text" class="text-danger font-weight-bold"></span></p>
                <p class="mb-0"><strong>Confidence Score:</strong> <span id="confidence-text" class="badge badge-success px-2 py-1"></span></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
